[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "basemode-evidence"
version = "0.1.0"
description = "Validate and compile privacy-preserving basemode evidence bundles"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["jsonschema[format]>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
basemode-evidence = "basemode_evidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/basemode_evidence"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
