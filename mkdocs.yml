site_name: basemode-evidence
site_description: Privacy-preserving public evidence for basemode endpoint calls
repo_url: https://github.com/FergusFettes/basemode-evidence
repo_name: basemode-evidence
site_url: https://fergusfettes.github.io/basemode-evidence/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate

plugins:
  - search
  - roamlinks

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts:
    - Architecture: concepts/Architecture.md
    - Privacy Model: concepts/Privacy Model.md
  - Reference:
    - Contribution Format: reference/Contribution Format.md
    - Validation: reference/Validation.md
    - Compiled Dataset: reference/Compiled Dataset.md
  - Operations:
    - Contributing Evidence: operations/Contributing Evidence.md
    - Revocations and Releases: operations/Revocations and Releases.md
  - Development:
    - Agent Quickstart: Agent Quickstart.md
