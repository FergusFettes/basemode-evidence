name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "contributions/**"

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Check
        run: make check
      - name: Verify wheel contents and installation
        run: |
          wheel=$(find dist -name '*.whl' -type f -print -quit)
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.11
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$wheel"
          cp tests/fixtures/valid-bundle.json "$RUNNER_TEMP/valid-bundle.json"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/basemode-evidence" \
            validate valid-bundle.json --no-path-check

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Test
        run: uv run pytest -q
