name: Validate contribution

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - id: validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          basemode-evidence validate-pr --base "$BASE_SHA" --head "$HEAD_SHA" | tee summary.txt
          {
            echo 'summary<<EOF'
            cat summary.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Comment validation summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.validate.outputs.summary }}
        with:
          script: |
            const marker = '<!-- basemode-evidence-validation -->';
            const body = `${marker}\n✅ Valid evidence contribution\n\n${process.env.SUMMARY}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
