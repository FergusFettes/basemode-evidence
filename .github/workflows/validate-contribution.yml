name: Validate contribution

on:
  pull_request:
    paths:
      - "contributions/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Build the validator from the trusted base revision before checking out
      # contributor-controlled data. A contribution cannot replace CI code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Build trusted validator
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          uv build --wheel
          wheel=$(find dist -name '*.whl' -type f -print -quit)
          uv venv "$RUNNER_TEMP/validator" --python 3.12
          uv pip install --python "$RUNNER_TEMP/validator/bin/python" "$wheel"
      - name: Check out contribution
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git checkout --detach "$HEAD_SHA"
      - id: validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/validator/bin/basemode-evidence" \
            validate-pr --base "$BASE_SHA" --head "$HEAD_SHA" | tee summary.txt
          {
            echo 'summary<<EOF'
            cat summary.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Comment validation summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY: ${{ steps.validate.outputs.summary }}
        with:
          script: |
            const marker = '<!-- basemode-evidence-validation -->';
            const body = `${marker}\n✅ Valid evidence contribution\n\n${process.env.SUMMARY}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
