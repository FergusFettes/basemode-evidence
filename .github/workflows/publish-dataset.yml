name: Publish dataset

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dataset
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Verify before publication
        run: make lint test
      - run: uv run basemode-evidence compile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: basemode-evidence-dataset
          path: |
            dist/endpoint_summary.json
            dist/endpoint_evidence.sqlite
            dist/provenance.json
            dist/manifest.json
            dist/SHA256SUMS
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dataset-latest >/dev/null 2>&1 || \
            gh release create dataset-latest --title "Latest evidence dataset" \
              --notes "Rolling, checksum-verifiable basemode evidence dataset."
          gh release upload dataset-latest \
            dist/endpoint_summary.json \
            dist/endpoint_evidence.sqlite \
            dist/provenance.json \
            dist/manifest.json \
            dist/SHA256SUMS \
            --clobber
