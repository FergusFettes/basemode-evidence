name: Publish dataset

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dataset
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Verify before publication
        run: make lint test
      - run: uv run basemode-evidence compile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: basemode-evidence-dataset
          path: |
            dist/endpoint_summary.json
            dist/endpoint_evidence.sqlite
            dist/provenance.json
            dist/manifest.json
            dist/SHA256SUMS
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dataset-latest >/dev/null 2>&1 || \
            gh release create dataset-latest --title "Latest evidence dataset" \
              --notes "Rolling, checksum-verifiable basemode evidence dataset."
          gh release upload dataset-latest \
            dist/endpoint_summary.json \
            dist/endpoint_evidence.sqlite \
            dist/provenance.json \
            dist/manifest.json \
            dist/SHA256SUMS \
            --clobber
      - name: Advance rolling release tag
        run: |
          git tag --force dataset-latest "$GITHUB_SHA"
          git push origin refs/tags/dataset-latest --force
